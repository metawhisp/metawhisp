<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Site Four Forty-Seven</title></head>
<body>
<main>
  <!-- ITER-076 stage 7: a "demo" form that shows what it costs — its button
       sends a payment, whatever its words: never pressed, a Yes or not. -->
  <h1 id="title">Book a paid demo</h1>
  <form id="demo" action="/thanks" method="post">
    <p>The demo costs $49.00.</p>
    <label for="first">First name</label><input id="first" name="first" autocomplete="given-name">
    <label for="email">Work email</label><input id="email" name="email" type="email">
    <button type="submit" id="send">Book it</button>
  </form>
</main>
</body>
</html>
