<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Site Twenty-Eight</title>
<style>.box { display:inline-block; min-width:40px; min-height:20px; }
  /* Each secret field is marked by its structure: it draws dots (ITER-076 I-09, round 5). */
  .dots { -webkit-text-security: disc; }</style></head>
<body>
<main>
  <h1>Drafts</h1>
  <p>Public words stay</p>
  <ul>
    <li><x-editor id="editor">Private draft slotted</x-editor> <button>Save draft</button></li>
    <li><div class="box dots" role="combobox" aria-label="Password" tabindex="0">secret-combo</div> <button>Go</button></li>
  </ul>
  <x-bare id="bare">Unrendered host text</x-bare>
  <div id="vault" class="dots" role="combobox" aria-label="Password" hidden>secret-in-label</div>
  <button aria-labelledby="vault">Unlock</button>
  <button id="leaky"><span class="dots" role="combobox" aria-label="Password" hidden><img alt="SECRET-HIDDEN" width="10" height="10" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="></span></button>
  <span class="box dots" role="combobox" aria-label="Password" tabindex="0"><input type="image" alt="SECRET-INPUT" width="10" height="10" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="><button aria-label="SECRET-LABEL">x</button></span>
  <form action="https://site-28.test/sign-in" method="post">
    <span class="box dots" role="combobox" aria-label="Password" tabindex="0"><button aria-label="SECRET-SUBMIT">x</button></span>
    <input type="email" aria-label="Email">
  </form>
  <form action="https://site-28.test/other" method="post">
    <input type="email" aria-label="Work email">
    <input type="submit" class="dots" name="password" value="SECRET-SELF">
  </form>
  <button id="leaky-too"><span class="box dots" role="combobox" aria-label="Password" tabindex="0"><img alt="SECRET-SENSITIVE" width="10" height="10" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="></span></button>
</main>
<script>
  document.getElementById('editor').attachShadow({ mode: 'open' }).innerHTML =
    '<div role="textbox" aria-label="Draft" tabindex="0" style="display:inline-block;min-width:40px;min-height:20px">' +
    '<slot></slot></div>';
  document.getElementById('bare').attachShadow({ mode: 'open' }).innerHTML = '<p>Component body</p>';
</script>
</body>
</html>
