<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Site One Hundred Nineteen</title></head>
<body>
<main>
  <h1>Search forms</h1>
  <!-- A GET search with no submit control. -->
  <form action="https://site-119.test/results" method="get">
    <label>Search the docs <input name="q" type="search" value="voice notes"></label>
  </form>
  <!-- A GET search with its Go button. -->
  <form action="https://site-119.test/find" method="get">
    <label>Find a page <input name="p" type="text"></label>
    <button type="submit">Go</button>
  </form>
</main>
</body>
</html>
