<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Site Two Hundred Sixty-Five</title>
<style>
  body { margin: 0; font: 16px sans-serif; }
  button { position: fixed; left: 0; top: 0; width: 100%; height: 100%; margin: 0; }
</style>
</head>
<body>
<main id="main"></main>
<script>
  // A widget of another site, drawn by its path: each path one widget.
  const main = document.getElementById('main');
  const path = location.pathname;
  if (path === '/upload') {
    // A button the size of the widget that asks for a file, and says to
    // the page it was pressed.
    main.innerHTML = '<input type="file" id="file" hidden><button type="button">Attach a file</button>';
    main.querySelector('button').addEventListener('click', () => {
      parent.postMessage(location.host, '*');
      document.getElementById('file').click();
    });
  } else if (path === '/plain') {
    main.innerHTML = '<button type="button">Open</button>';
  }
</script>
</body>
</html>
