<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Site One Hundred Sixty-Two</title>
<style>
  body { margin: 0; font: 16px sans-serif; }
  main { padding: 24px 40px; }
  #outer { position: relative; display: inline-block; padding: 8px 12px; border: 1px solid #333; }
  #inner { position: absolute; left: 0; top: 0; right: 0; bottom: 0; }
</style>
</head>
<body>
<main>
  <h1>Terms</h1>
  <form id="other" action="/other" method="get"><button id="go" type="submit">Go elsewhere</button></form>
  <div id="place"></div>
</main>
<script>
  // Built by script, as nesting a label in a label is not something the
  // parser keeps: an outer label for a hidden checkbox, covered whole by a
  // plain label for the other form's submit button.
  const box = document.createElement('input');
  box.type = 'checkbox';
  box.id = 'agree';
  box.hidden = true;
  const outer = document.createElement('label');
  outer.id = 'outer';
  outer.htmlFor = 'agree';
  outer.textContent = 'I agree';
  const inner = document.createElement('label');
  inner.id = 'inner';
  inner.htmlFor = 'go';
  outer.appendChild(inner);
  const place = document.getElementById('place');
  place.appendChild(box);
  place.appendChild(outer);
</script>
</body>
</html>
