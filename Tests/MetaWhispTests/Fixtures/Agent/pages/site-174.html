<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Site One Hundred Seventy-Four</title><style>body { margin: 0; font: 16px sans-serif; }</style></head>
<body>
<main>
  <h1>A widget that comes later</h1>
  <button type="button">Top button</button>
</main>
<script>
  // The widget loads a moment after the page.
  setTimeout(() => {
    const frame = document.createElement('iframe');
    frame.src = 'https://site-172.test/';
    frame.style.cssText = 'width:300px;height:60px;border:0';
    document.querySelector('main').append(frame);
  }, 1500);
</script>
</body>
</html>
