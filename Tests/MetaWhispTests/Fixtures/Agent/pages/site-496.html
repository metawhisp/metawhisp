<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Site Four Hundred Ninety-Six</title>
<style>
  body { margin: 0; font: 16px sans-serif; }
  main { padding: 24px 40px; }
  #notice { position: fixed; bottom: 0; left: 0; right: 0; background: #333; color: #fff; padding: 12px; }
</style>
</head>
<body>
<main>
  <h1>Plans</h1>
  <button id="compare" onclick="window.compared = (window.compared || 0) + 1">Compare plans</button>
</main>
<!-- A cookie notice fixed to the viewport that offers only its accept: it blocks nothing, so it is read past —
     never the user's part — and its accept is decided as any control when the brain goes for it (2026-10-19). -->
<div id="notice">
  Cookie notice: we use cookies.
  <button id="gotit" onclick="window.gotIt = (window.gotIt || 0) + 1">Got it</button>
</div>
</body>
</html>
