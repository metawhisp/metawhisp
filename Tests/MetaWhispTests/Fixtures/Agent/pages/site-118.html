<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Site One Hundred Eighteen</title></head>
<body>
<main>
  <h1>Kasse</h1>
  <!-- Native submit buttons that name themselves a tab or a box: they still
       send their form, and the form shows what it costs. -->
  <form action="https://site-118.test/zahlen-tab" method="post">
    <p>Gesamtsumme: 49,90 €</p>
    <button type="submit" role="tab">Weiter zur Zahlung</button>
  </form>
  <form action="https://site-118.test/zahlen-box" method="post">
    <p>Gesamtsumme: 19,90 €</p>
    <button type="submit" role="checkbox" aria-checked="false">Bestellung bestätigen</button>
  </form>
</main>
</body>
</html>
