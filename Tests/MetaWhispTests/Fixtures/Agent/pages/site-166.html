<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Site One Hundred Sixty-Six</title>
<style>
  body { margin: 0; font: 16px sans-serif; }
  main { padding: 24px 40px; }
  .choice { position: relative; margin: 14px 0; height: 28px; }
  .choice input { position: absolute; left: 0; top: 4px; width: 20px; height: 20px; margin: 0; }
  .choice input.faded { opacity: 0; }
  .choice label { display: inline-block; padding-left: 30px; line-height: 28px; position: relative; }
</style>
</head>
<body>
<main>
  <h1>Display</h1>
  <!-- A switch whose box the page fades and shows again, the same node. -->
  <div class="choice"><input id="dark" type="checkbox" role="switch" class="faded"><label for="dark">Dark mode</label></div>
</main>
<script>
  const fade = (faded) => document.getElementById('dark').classList.toggle('faded', faded);
</script>
</body>
</html>
