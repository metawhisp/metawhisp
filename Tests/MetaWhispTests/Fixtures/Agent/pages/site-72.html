<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Site Seventy-Two</title></head>
<body>
<main>
  <h1>Recorders</h1>
  <label for="sort">Sort by</label>
  <select id="sort" onchange="location.search = '?sort=' + this.value">
    <option value="relevance">Relevance</option>
    <option value="price">Price</option>
  </select>
  <ul>
    <li>Recorder One</li>
    <li>Recorder Two</li>
  </ul>
</main>
<script>
  const sort = new URLSearchParams(location.search).get('sort');
  if (sort) document.getElementById('sort').value = sort;
</script>
</body>
</html>
