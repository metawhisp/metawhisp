<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Site One Hundred Eighty-Four</title>
<style>
  body { margin: 0; font: 16px sans-serif; }
  main { padding: 24px 40px; }
  .row { margin: 12px 0; height: 40px; }
  .select { display: inline-block; width: 220px; height: 36px; line-height: 36px; padding: 0 8px; border: 1px solid #777; }
  #status-list { position: absolute; left: 320px; top: 80px; width: 200px; border: 1px solid #777; background: #fff; }
  [role=option] { height: 32px; line-height: 32px; padding: 0 8px; }
</style>
</head>
<body>
<main>
  <h1>Records</h1>
  <!-- Two dropdowns no one can tell apart, in one POST form, share one list; the open one owns it. -->
  <form id="records" action="/records" method="post">
    <div class="row">
      <div id="a" class="select" role="combobox" aria-label="Status" aria-haspopup="listbox"
           aria-expanded="true" aria-controls="status-list">Active</div></div>
    <div class="row">
      <div id="b" class="select" role="combobox" aria-label="Status" aria-haspopup="listbox"
           aria-expanded="false" aria-controls="status-list">Active</div></div>
  </form>
</main>
<script>
  // The list, drawn for whichever record is open; the test calls these.
  const draw = () => {
    const old = document.getElementById('status-list');
    if (old) old.remove();
    const list = document.createElement('div');
    list.id = 'status-list';
    list.setAttribute('role', 'listbox');
    for (const name of ['Active', 'Archived']) {
      const option = document.createElement('div');
      option.setAttribute('role', 'option');
      option.textContent = name;
      option.addEventListener('click', () => {
        const owner = document.querySelector('[role=combobox][aria-expanded=true]');
        const form = document.getElementById('records');
        form.action = '/records/' + owner.id;
        form.requestSubmit();
      });
      list.appendChild(option);
    }
    document.body.appendChild(list);
  };
  const retarget = () => {
    document.getElementById('a').setAttribute('aria-expanded', 'false');
    document.getElementById('b').setAttribute('aria-expanded', 'true');
  };
  draw();
  // A third dropdown, one of its kind, drawn after the shared list, and its
  // own list after it: what it is moves up when the shared list's options
  // are left out.
  const owner = document.createElement('div');
  owner.id = 'p';
  owner.className = 'select';
  owner.setAttribute('role', 'combobox');
  owner.setAttribute('aria-label', 'Priority');
  owner.setAttribute('aria-haspopup', 'listbox');
  owner.setAttribute('aria-expanded', 'true');
  owner.setAttribute('aria-controls', 'priority-list');
  owner.textContent = 'High';
  owner.style.cssText = 'position: absolute; left: 40px; top: 260px;';
  document.body.appendChild(owner);
  const priority = document.createElement('div');
  priority.id = 'priority-list';
  priority.setAttribute('role', 'listbox');
  for (const name of ['High', 'Low']) {
    const option = document.createElement('div');
    option.setAttribute('role', 'option');
    option.textContent = name;
    priority.appendChild(option);
  }
  priority.style.cssText = 'position: absolute; left: 320px; top: 260px; width: 200px; border: 1px solid #777; background: #fff;';
  document.body.appendChild(priority);
</script>
</body>
</html>
