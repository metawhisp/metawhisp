<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Site Four Hundred Eighty Eight</title></head>
<body>
<main>
  <h1>Lamps</h1>
  <!-- The brain's shop (2026-10-19): the card's price is put in by the test right before the first press, as a
       price that loads after the look. A press is counted, never sent. -->
  <section class="card">
    <h2>Desk lamp</h2>
    <p id="price"></p>
    <button type="button" id="add" onclick="window.added = (window.added || 0) + 1;">Add to cart</button>
  </section>
</main>
</body>
</html>
