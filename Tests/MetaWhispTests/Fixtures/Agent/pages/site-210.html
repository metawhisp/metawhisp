<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Site Two Hundred Ten</title>
<style>
  body { margin: 0; font: 16px sans-serif; }
  main { padding: 24px 40px; }
  a { display: block; width: 260px; height: 36px; margin: 8px 0; }
</style>
</head>
<body>
<main>
  <h1>More files</h1>
  <!-- Answers of a type no page is drawn from: Chrome would save them. -->
  <a href="https://site-210.test/files/app.dmg?type=application%2Fx-apple-diskimage">The disk image</a>
  <a href="https://site-210.test/files/thing.xyz?type=application%2Fx-made-up-kind">The unknown file</a>
  <!-- An answer Chrome draws as a page. -->
  <a href="https://site-210.test/files/list.json?type=application%2Fjson">The listing</a>
  <!-- An address that never answers: the request fails. -->
  <a href="https://elsewhere.example/">Elsewhere</a>
</main>
</body>
</html>
