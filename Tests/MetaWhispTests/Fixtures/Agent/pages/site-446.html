<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Site Four Forty-Six</title></head>
<body>
<main>
  <!-- ITER-076 stage 7: a search of two fields — no e-mail, no phone: no form
       of the user's details, so no preview. -->
  <h1>Flights</h1>
  <form id="flights" action="/results" method="get">
    <label for="from">From</label><input id="from" name="from" autocomplete="address-level2">
    <label for="to">To</label><input id="to" name="to">
    <button type="submit">Search flights</button>
  </form>
</main>
</body>
</html>
