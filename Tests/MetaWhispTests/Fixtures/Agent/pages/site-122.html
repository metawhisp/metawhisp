<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Site One Hundred Twenty-Two</title></head>
<body>
<main>
  <h1>Search results</h1>
  <button type="button" id="load">Load results</button>
  <div id="results"></div>
</main>
<script>
  // The results arrive a while after the click; a spinner shows until then,
  // and nothing else on the page moves meanwhile.
  document.getElementById('load').addEventListener('click', () => {
    const results = document.getElementById('results');
    results.innerHTML = '<div class="spinner" style="width: 40px; height: 40px; border: 4px solid #999">&nbsp;</div>';
    setTimeout(() => {
      results.innerHTML = '<a href="https://site-122.test/a">Result A</a>';
    }, 800);
  });
</script>
</body>
</html>
