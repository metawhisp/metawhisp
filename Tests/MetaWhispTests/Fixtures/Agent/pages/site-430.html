<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Unseen 430</title></head>
<body>
<div role="main">
  <!-- ITER-076 stage 4a: a main content none of whose words a person sees —
       see-through, hidden, not drawn, or someone's writing — so a read of it
       keeps nothing and says why, rule by rule. Nothing outside it either:
       the body, read in its place (stage 4c), keeps nothing too. -->
  <div style="opacity: 0"><h1>Faded heading</h1><p>Faded line one</p><p>Faded line two</p></div>
  <p style="visibility: hidden">Hidden line</p>
  <div style="display: none"><p>Undrawn line</p></div>
  <div contenteditable="true">Someone's draft</div>
</div>
</body>
</html>
