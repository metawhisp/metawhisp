<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Search 415</title></head>
<body>
<main>
  <h1 id="heading">Find a joke</h1>
</main>
<script>
  // A site's own GET search, built from the address: ?kind=email makes it a
  // one-field e-mail form; ?category=1 adds a filled category select;
  // ?button=0 leaves its button out; ?button=hidden draws it at no size and
  // transparent, as a search box that sends on Enter draws its own; ?mode=ignore keeps a hidden field that
  // makes its results page ignore the query (it shows the form again); ?mode=again draws the results with the
  // form again under them, the query in its box, as a search engine's results page does. The
  // form's page code — its button's click, its submit — goes elsewhere: a
  // search that ran it would land on /clicked or /submitted.
  const params = new URLSearchParams(location.search);
  const results = location.pathname === '/search' && params.get('mode') !== 'ignore';
  document.title = results ? 'Results 415' : 'Search 415';
  const drawForm = (query) => {
    const email = params.get('kind') === 'email';
    const form = document.createElement('form');
    form.action = email ? '/join' : '/search';
    form.method = 'get';
    const hidden = document.createElement('input');
    hidden.type = 'hidden';
    hidden.name = 'src';
    hidden.value = 'hp & home';
    form.appendChild(hidden);
    if (params.get('mode')) {
      const mode = document.createElement('input');
      mode.type = 'hidden';
      mode.name = 'mode';
      mode.value = params.get('mode');
      form.appendChild(mode);
    }
    const field = document.createElement('input');
    field.type = email ? 'email' : 'search';
    field.name = email ? 'email' : 'q';
    field.setAttribute('aria-label', email ? 'Email' : 'Search');
    field.value = query;
    form.appendChild(field);
    if (params.get('category') === '1') {
      const select = document.createElement('select');
      select.name = 'cat';
      select.setAttribute('aria-label', 'Category');
      for (const label of ['All', 'Books']) select.appendChild(new Option(label, label.toLowerCase()));
      form.appendChild(select);
    }
    if (params.get('button') !== '0') {
      const button = document.createElement('button');
      button.type = 'submit';
      button.textContent = email ? 'Join' : 'Search';
      button.addEventListener('click', (event) => { event.preventDefault(); location.assign('/clicked'); });
      if (params.get('button') === 'hidden') button.style.cssText = 'width:0;padding:0;border:0;opacity:0;overflow:hidden';
      form.appendChild(button);
    }
    form.addEventListener('submit', (event) => { event.preventDefault(); location.assign('/submitted'); });
    document.querySelector('main').appendChild(form);
  };
  if (results) {
    document.getElementById('heading').textContent = 'Results for ' + (params.get('q') || '');
    if (params.get('mode') === 'again') drawForm(params.get('q') || '');
  } else {
    drawForm('');
  }
</script>
</body>
</html>
