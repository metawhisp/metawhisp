<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Site Four Hundred Ninety-Two</title></head>
<body>
<main>
  <h1>Opening hours</h1>
  <p>Open today from 10:00 to 17:30.</p>
</main>
<!-- The brain's cookie window (2026-10-19): its least consent asks no Yes, once on a page. The window stays after a
     click, so a second click there is decided as any control. -->
<div id="consent" role="dialog" aria-modal="true" aria-label="Cookie consent">
  <p>We use cookies to improve the site.</p>
  <button id="accept" onclick="window.accepted = (window.accepted || 0) + 1">Accept all</button>
  <button id="decline" onclick="window.declined = (window.declined || 0) + 1">Decline all</button>
</div>
</body>
</html>
