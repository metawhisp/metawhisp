<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Site Sixty-Eight</title></head>
<body>
<main id="list">
  <h1>A long page with nothing secret</h1>
  <select aria-label="Early choice"><option>First choice</option><option>Second choice</option></select>
</main>
<script>
  const list = document.getElementById('list');
  for (let i = 0; i < 6000; i++) {
    const a = document.createElement('a');
    a.href = '/item/' + i; a.textContent = 'Item ' + i; a.style.display = 'block';
    list.appendChild(a);
  }
</script>
</body>
</html>
