<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Site Four Hundred Seventy-Four</title>
<style>
  body { margin: 0; font: 16px sans-serif; }
  main { padding: 24px 40px; }
  iframe { width: 420px; height: 180px; border: 1px solid #777; }
</style>
</head>
<body>
<main>
  <h1>Frames</h1>
  <!-- A frame of the page's own origin, as a practice site's frames page draws its email form: the form's own
       heading is in the frame, below a heading of the page that names the frame. -->
  <h2>Internal IFrame: Email Subscription</h2>
  <iframe title="Email subscription" srcdoc="<h1>Send updates to my inbox</h1><label>Email <input type=email></label> <button>Subscribe</button>"></iframe>
  <h2>Discover more</h2>
</main>
<footer><p>Footer words</p></footer>
</body>
</html>
