<head><meta charset="utf-8"><title>New tab 480</title></head>

<nav><a href="https://site-480.test/link">New tab link</a></nav>
<main id="page"></main>
<script>
  // A side menu's link to the page itself, named like the task's, beside the link that opens the new page
