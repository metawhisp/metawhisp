<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Site One Hundred Six</title></head>
<body>
<main>
  <h1>Start</h1>
  <!-- Two forms that send to the same address, each with a field named
       "value": one a password, one a search. -->
  <form id="login" action="/" method="post">
    <input type="password" name="value" aria-label="Passwort" value="geheim-123">
    <button type="submit">Anmelden</button>
  </form>
  <form id="search" action="/" method="get">
    <input type="search" name="value" aria-label="Suche" value="voice notes">
    <button type="submit">Suchen</button>
  </form>
</main>
</body>
</html>
