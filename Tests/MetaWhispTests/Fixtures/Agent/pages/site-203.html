<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Site Two Hundred Three</title>
<style>body { margin: 0; font: 16px sans-serif; } main { padding: 16px 40px; }
  iframe { display: block; border: 0; width: 400px; height: 120px; }
  #slid { display: block; width: 400px; height: 60px; margin: 0; border: 0; }</style>
</head>
<body>
<main>
  <h1>A widget below the fold</h1>
  <div style="height: 1200px"></div>
  <!-- Brought on screen, the page shifts it: what was under the point is something else then. -->
  <iframe srcdoc="<style>body{margin:0;font:16px sans-serif}button{display:block;width:300px;height:40px;margin:0;border:0}</style><button onclick=&quot;document.getElementById('log').textContent += 'saved;'&quot;>Save</button><p id=log></p>"></iframe>
  <p id="log"></p>
</main>
<script>
  function log(text) { document.getElementById('log').textContent += text + ';'; }
  // A moment after the page is scrolled, a button comes above the widget.
  let shifting = false;
  window.addEventListener('scroll', () => {
    if (shifting) return;
    shifting = true;
    setTimeout(() => {
      const slid = document.createElement('button');
      slid.id = 'slid';
      slid.type = 'button';
      slid.textContent = 'Delete everything';
      slid.addEventListener('click', () => log('deleted'));
      document.querySelector('iframe').before(slid);
    }, 40);
  });
</script>
</body>
</html>
